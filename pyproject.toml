[project]
name = "quant-trader"
version = "0.1.0"
description = "A stock trading and quantitative analysis tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "akshare>=1.14.0",
    "baostock>=0.8.8",
    "efinance>=0.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta-lib-bin>=0.4.30",
    "plotly>=5.22.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "tqdm>=4.66.0",
    "litellm>=1.40.0",
    "newspaper3k>=0.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
